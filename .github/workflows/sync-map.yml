name: Sync BED Map from Airtable

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'bedmap-sync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build snapshot from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/sync-airtable.mjs

      - name: Commit snapshot if changed
        id: commit
        run: |
          git config user.name "bedmap-sync[bot]"
          git config user.email "bedburningman@users.noreply.github.com"
          if git diff --quiet app/src/data/camps-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add app/src/data/camps-snapshot.json
            git commit -m "Sync camps snapshot from Airtable"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        if: steps.commit.outputs.changed == 'true'
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: app/dist
          branch: gh-pages

      - name: Close trigger issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
